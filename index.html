<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hazina Money</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="description" content="Personal finance tracker for Kenya: income, expenses, budgets, M-Pesa, investments, loans and reports.">
<meta name="theme-color" content="#0B2655">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hazina">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one column of cards, bottom tab bar and a floating add button. From 960px the tab bar becomes a left rail and cards flow in two columns. */
:root{
  --bg:#EDF2F9; --surface:#FFFFFF; --surface-2:#E5EDF8; --ink:#0A1A33; --muted:#52627C; --line:#D3DEED; --line-soft:#E2E9F3;
  --accent:#1652B0; --accent-ink:#FFFFFF; --tint:#DCE8F8; --tint-ink:#123F86;
  --c1:#0B2B60; --c2:#1652B0; --c3:#2F74D8; --c4:#5F98E6; --c5:#96BCEF; --c6:#C8DCF6;
  --neg:#A8425A; --neg-tint:#F6E4E9;
  --hero-bg:#0B2655; --hero-bg-2:#123A7A; --hero-ink:#F3F7FF; --hero-muted:#A9C0E6; --hero-line:rgba(169,192,230,.22); --hero-warn:#FFC2CE;
  --shadow:0 1px 2px rgba(11,38,85,.05),0 6px 20px rgba(11,38,85,.06);
  --scrim:rgba(6,18,38,.48);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06101E; --surface:#0D1A2D; --surface-2:#14253E; --ink:#E5EDF9; --muted:#8FA3C1; --line:#213656; --line-soft:#182A45;
  --accent:#5B95EC; --accent-ink:#04101F; --tint:#14304F; --tint-ink:#B3CFF6;
  --c1:#D6E5FB; --c2:#8DB6F1; --c3:#5B95EC; --c4:#3474D2; --c5:#2457A6; --c6:#1A3D74;
  --neg:#E58A9E; --neg-tint:#3A1B26;
  --hero-bg:#11305F; --hero-bg-2:#1A4282; --hero-ink:#F3F7FF; --hero-muted:#AFC6EA; --hero-line:rgba(175,198,234,.22);
  --shadow:none; --scrim:rgba(0,0,0,.62); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#06101E; --surface:#0D1A2D; --surface-2:#14253E; --ink:#E5EDF9; --muted:#8FA3C1; --line:#213656; --line-soft:#182A45;
  --accent:#5B95EC; --accent-ink:#04101F; --tint:#14304F; --tint-ink:#B3CFF6;
  --c1:#D6E5FB; --c2:#8DB6F1; --c3:#5B95EC; --c4:#3474D2; --c5:#2457A6; --c6:#1A3D74;
  --neg:#E58A9E; --neg-tint:#3A1B26;
  --hero-bg:#11305F; --hero-bg-2:#1A4282; --hero-ink:#F3F7FF; --hero-muted:#AFC6EA; --hero-line:rgba(175,198,234,.22);
  --shadow:none; --scrim:rgba(0,0,0,.62); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 96px)}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:34px;height:34px;border-radius:10px;background:var(--hero-bg);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand-txt{min-width:0}
.brand-txt h1{font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt p{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--c4)}
.sync[data-s="saving"] i,.sync[data-s="syncing"] i{background:var(--c5);animation:pulse 1s infinite alternate}
.sync[data-s="local"] i{background:var(--muted)}
.sync[data-s="error"] i{background:var(--neg)}
@keyframes pulse{to{opacity:.3}}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-soft);flex:none}
.icon-btn svg{width:20px;height:20px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block:2px 14px}
.monthbar .mb-label{font-family:var(--f-display);font-weight:600;font-size:17px}
.monthbar .mb-btns{display:flex;gap:6px}
.chev{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-soft)}
.chev svg{width:18px;height:18px}
.chev:disabled{opacity:.35;cursor:default}
.today-btn{height:36px;padding-inline:12px;border-radius:10px;background:var(--tint);color:var(--tint-ink);font-size:13px;font-weight:500}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line-soft);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;font-size:11px;color:var(--muted);font-weight:500;min-width:0}
.nav button span.ic{width:46px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.nav svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] span.ic{background:var(--tint);color:var(--tint-ink)}
.nav .nav-more{display:none}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:31;width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(11,38,85,.28)}
.fab svg{width:26px;height:26px}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-bottom:48px}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;border:0;background:transparent;padding:76px 0 0}
  .nav button{flex:none;flex-direction:row;gap:10px;font-size:14.5px;padding:4px 8px;border-radius:12px;justify-content:flex-start}
  .nav button span.ic{width:38px}
  .nav .nav-more{display:flex}
  .top .more-btn{display:none}
  .fab{right:max(24px,calc((100vw - 1180px)/2 + 24px));bottom:28px}
}

/* ---------- content ---------- */
.view{display:grid;gap:14px}
.grid2{display:grid;gap:14px}
@media (min-width:720px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:17px;font-weight:600}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.link{color:var(--accent);font-weight:500;font-size:13.5px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.neg{color:var(--neg)}
.empty{padding:18px 4px;text-align:center;color:var(--muted);font-size:14px}
.empty .btn{margin-top:10px}

.hero{border-radius:24px;padding:20px 18px 16px;color:var(--hero-ink);background:linear-gradient(160deg,var(--hero-bg-2),var(--hero-bg) 55%);position:relative;overflow:hidden}
.hero .eyebrow{color:var(--hero-muted)}
.hero-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero-num{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,8.5vw,42px);letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.hero-num small{font-size:.5em;font-weight:500;color:var(--hero-muted);margin-right:4px;letter-spacing:0}
.hero-delta{font-size:13px;color:var(--hero-muted);margin-top:4px}
.hero-spark{display:block;width:100%;height:56px;margin-block:10px 6px}
.hero-split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--hero-line);padding-top:12px;gap:8px}
.hero-split div{min-width:0}
.hero-split span{display:block;font-size:11.5px;color:var(--hero-muted)}
.hero-split b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:12px;min-width:0;box-shadow:var(--shadow)}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}

.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line-soft);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .axis.on{fill:var(--ink);font-weight:600}
.bar-a{fill:var(--c2)} .bar-b{fill:var(--c5)} .bar-1{fill:var(--c3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.split{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:380px){.split{grid-template-columns:110px minmax(0,1fr);gap:12px}}
.donut{width:100%;height:auto;display:block}
.donut-track{stroke:var(--surface-2)}
.donut-k{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.donut-v{fill:var(--ink);font-size:15px;font-weight:600;font-family:var(--f-display)}
.keys{display:grid;gap:8px;min-width:0}
.key{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.key i{width:10px;height:10px;border-radius:3px}
.key span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key b{font-weight:500}

.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative}
.prog>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.prog.over>i{background:var(--neg)}
.prog .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.brow{display:grid;gap:6px;padding-block:10px;border-top:1px solid var(--line-soft)}
.brow:first-child{border-top:0;padding-top:0}
.brow-h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.brow-h span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.brow-f{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}

.list{display:grid}
.tx{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-soft);text-align:left;width:100%}
.list>.tx:first-child{border-top:0}
.tx-ic{width:38px;height:38px;border-radius:12px;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.tx-ic.in{background:var(--accent);color:var(--accent-ink)}
.tx-ic.tr{background:var(--surface-2);color:var(--muted)}
.tx-main{min-width:0;display:grid}
.tx-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:600;white-space:nowrap}
.tx-amt.in{color:var(--accent)}
.tx-amt.tr{color:var(--muted);font-weight:500}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:14px 2px 4px;font-weight:500}
.day-h:first-child{padding-top:0}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding-inline:14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sm{height:30px;font-size:12.5px;padding-inline:11px}
.fee-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding-inline:12px;height:44px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding-inline:16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14.5px;white-space:nowrap}
.btn.ghost{background:var(--tint);color:var(--tint-ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--neg-tint);color:var(--neg)}
.btn.sm{height:34px;padding-inline:12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;height:22px;padding-inline:8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--tint);color:var(--tint-ink);white-space:nowrap}
.pill.warn{background:var(--neg-tint);color:var(--neg)}
.pill.solid{background:var(--accent);color:var(--accent-ink)}

.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.tabs button{height:36px;border-radius:9px;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.item{border-top:1px solid var(--line-soft);padding-block:14px;display:grid;gap:10px}
.item:first-child{border-top:0;padding-top:0}
.item-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-h h3{font-size:16px;font-weight:600}
.item-h .muted{font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}

.acct{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line-soft);text-align:left;width:100%}
.acct:first-child{border-top:0;padding-top:0}

.banner{background:var(--tint);color:var(--tint-ink);border-radius:var(--r-md);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;font-size:13.5px}
.banner b{font-weight:600}

.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right;padding-right:0}
.share{height:6px;border-radius:99px;background:var(--surface-2);min-width:60px;overflow:hidden}
.share i{display:block;height:100%;background:var(--c3);border-radius:99px}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@media (min-width:720px){.sheet-wrap{align-items:center}.sheet{border-radius:24px;max-height:86%}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sheet-h h2{font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
form.f{display:grid;gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding-inline:12px;font-size:16px;outline:none;min-width:0}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.fld.amt input{height:58px;font-family:var(--f-display);font-size:26px;font-weight:600}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:grid;place-items:center;height:38px;border-radius:9px;font-weight:500;font-size:14px;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.ferr{color:var(--neg);font-size:13px;min-height:0}
.f-actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:4px}
.f-actions .btn:last-child{flex:1}
.budget-list{display:grid;gap:8px}
.budget-row{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:center;font-size:14px}
.budget-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.budget-row input{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding-inline:10px;font-size:16px;width:100%;text-align:right}

.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:110!important;bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (min-width:960px){.toast{bottom:32px}}

<script>
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const ymOf = iso => iso.slice(0,7);
const addMonths = (ym, n) => { let [y,m] = ym.split('-').map(Number); m += n; y += Math.floor((m-1)/12); m = ((m-1)%12+12)%12+1; return `${y}-${pad(m)}`; };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthLabel = (ym, long) => (long ? MONTHS_L : MONTHS)[+ym.slice(5,7)-1] + ' ' + ym.slice(0,4);
const dim = ym => new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate();
const monthRange = ym => [ym + '-01', ym + '-' + pad(dim(ym))];
const fmtDate = iso => iso ? `${+iso.slice(8)} ${MONTHS[+iso.slice(5,7)-1]} ${iso.slice(0,4)}` : '';
const fmtDay = iso => { const d = new Date(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8)); const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]; return `${wd}, ${+iso.slice(8)} ${MONTHS[+iso.slice(5,7)-1]}`; };
const nf = new Intl.NumberFormat('en-KE', {maximumFractionDigits:0});
const ksh = n => (n < -0.5 ? '−' : '') + 'KSh ' + nf.format(Math.abs(Math.round(n)));
const kshNum = n => (n < -0.5 ? '−' : '') + nf.format(Math.abs(Math.round(n)));
const compact = n => { const a = Math.abs(n); let s; if (a >= 1e6) s = (a/1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/,'') + 'M'; else if (a >= 1e3) s = (a/1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/,'') + 'K'; else s = String(Math.round(a)); return (n < 0 ? '−' : '') + s; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g,'')); return isFinite(n) ? n : 0; };
const clone = o => JSON.parse(JSON.stringify(o));
const sum = (arr, f) => arr.reduce((s,x) => s + (f ? f(x) : x), 0);
const pct = (a,b) => b > 0 ? Math.round(a/b*100) : 0;

/* ================= Kenyan reference data ================= */
const CATS = {
  income: [
    ['salary','Salary'],['business','Business'],['hustle','Side hustle'],['freelance','Freelance & gigs'],
    ['rental','Rental income'],['farming','Farming'],['chama_in','Chama payout'],['interest','Interest & dividends'],
    ['gift_in','Gifts received'],['other_in','Other income']],
  expense: [
    ['rent','Rent & housing'],['food','Food & groceries'],['transport','Transport (matatu, boda, fuel)'],['airtime','Airtime & data'],
    ['power','Electricity (KPLC tokens)'],['water','Water'],['internet','Home internet & TV'],['school','School fees & education'],
    ['family','Family support'],['health','Health & SHA'],['church','Tithe'],['offering','Offerings & church giving'],['chama','Chama contribution'],
    ['loan','Loan repayment'],['eatout','Eating out'],['fun','Entertainment & outings'],['clothing','Clothing & grooming'],
    ['household','Household items'],['fees','M-Pesa & bank charges'],['insurance','Insurance'],['gifts','Gifts & harambee'],['other_ex','Other']]
};
const CAT_NAME = {}; const CAT_INI = {};
for (const t in CATS) for (const [id,name] of CATS[t]) { CAT_NAME[id] = name; CAT_INI[id] = name.replace(/[^A-Za-z ]/g,' ').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
const NEEDS = new Set(['rent','food','transport','airtime','power','water','internet','school','family','health','church','offering','loan','fees','insurance']);
const WANTS = new Set(['eatout','fun','clothing','household','gifts','other_ex']);
const ACCT_KINDS = {mobile:'Mobile money', bank:'Bank', cash:'Cash', sacco:'SACCO / savings'};
const INV_TYPES = {mmf:'Money market fund', tbill:'Treasury bill', tbond:'Treasury bond', sacco:'SACCO deposits & shares', nse:'NSE shares', chama:'Chama / investment group', land:'Land & real estate', pension:'Pension (NSSF / personal)', fixed:'Fixed deposit', unit:'Unit trust / ETF', other:'Other'};
const DEBT_TYPES = {helb:'HELB', fuliza:'Fuliza', mshwari:'M-Shwari / KCB M-Pesa', digital:'Digital lender (Tala, Branch…)', sacco:'SACCO loan', bank:'Bank loan', hustler:'Hustler Fund', chama:'Chama loan', car:'Car / asset finance', mortgage:'Mortgage', card:'Credit card', personal:'Friend / family', other:'Other'};
const TYPE_LABEL = {expense:'Expense', income:'Income', transfer:'Transfer'};

/* PAYE, Kenya — monthly. NSSF Year 4 limits (from Feb 2026), SHIF 2.75% (min 300), Housing Levy 1.5%.
   NSSF, SHIF and the Housing Levy are deducted before tax (Tax Laws (Amendment) Act 2024). */
function payeCalc(gross){
  gross = Math.max(0, gross);
  const LEL = 9000, UEL = 108000;
  const nssf1 = Math.min(gross, LEL) * 0.06;
  const nssf2 = Math.max(0, Math.min(gross, UEL) - LEL) * 0.06;
  const nssf = nssf1 + nssf2;
  const shif = gross > 0 ? Math.max(gross * 0.0275, 300) : 0;
  const ahl = gross * 0.015;
  const taxable = Math.max(0, gross - nssf - shif - ahl);
  const bands = [[24000,.10],[8333,.25],[467667,.30],[300000,.325],[Infinity,.35]];
  let rest = taxable, tax = 0;
  for (const [w,r] of bands) { const x = Math.min(rest, w); tax += x * r; rest -= x; if (rest <= 0) break; }
  const relief = 2400;
  const paye = Math.max(0, tax - relief);
  const net = gross - nssf - shif - ahl - paye;
  return {gross, nssf, shif, ahl, taxable, tax, relief, paye, net};
}

/* M-Pesa customer tariffs (2026). Each band is [max amount, fee]. Buy Goods (till) is free for customers; Paybill fees vary. */
const MPESA_SEND = [[100,0],[500,7],[1000,13],[1500,23],[2500,33],[3500,53],[5000,57],[7500,78],[10000,90],[15000,100],[20000,105],[35000,108],[50000,108],[250000,108]];
const MPESA_WD = [[49,null],[100,11],[2500,29],[3500,52],[5000,69],[7500,87],[10000,115],[15000,167],[20000,185],[35000,197],[50000,278],[250000,309]];
function mpesaFee(table, amt){ for (const [max, fee] of table) if (amt <= max) return fee; return null; }
function feeChild(t){ return {id:t.id+'-fee', ts:(t.ts||0)-1, type:'expense', amount:t.fee, cat:'fees', acct:t.acct, date:t.date, note:'Cost: ' + (t.note || (t.type==='transfer' ? 'transfer' : CAT_NAME[t.cat] || 'payment')), feeOf:t.id}; }

/* ================= state ================= */
let S = null;          // profile: settings, accounts, budgets, investments, debts, goals
let M = {};            // months: 'YYYY-MM' -> [transactions]
let MODE = 'real';     // 'sample' | 'real'
const UI = {view:'home', month: ymOf(todayISO()), txType:'all', q:'', wealthTab:'accounts', period:'month', from:'', to:'', debtSort:null};
const HOST_THEME = document.documentElement.getAttribute('data-theme');

function freshProfile(){
  return {v:1, settings:{name:'', theme:'system', debtStrategy:'avalanche', tithe:{on:true, pct:10}},
    accounts:[{id:'mpesa',name:'M-Pesa',kind:'mobile',opening:0},{id:'bank',name:'Bank account',kind:'bank',opening:0},{id:'cash',name:'Cash',kind:'cash',opening:0}],
    budgets:{}, investments:[], debts:[], goals:[]};
}
function normalize(p){
  const f = freshProfile();
  p = p && typeof p === 'object' ? p : {};
  return {v:1, settings:Object.assign(f.settings, p.settings||{}), accounts:Array.isArray(p.accounts)&&p.accounts.length?p.accounts:f.accounts,
    budgets:p.budgets&&typeof p.budgets==='object'?p.budgets:{}, investments:Array.isArray(p.investments)?p.investments:[],
    debts:Array.isArray(p.debts)?p.debts:[], goals:Array.isArray(p.goals)?p.goals:[]};
}

/* ---------- derived data ---------- */
let TX = null;
function txAll(){
  if (!TX) { TX = []; for (const k in M) for (const t of (M[k]||[])) TX.push(t);
    TX.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.ts||0) - (a.ts||0)); }
  return TX;
}
const txIn = (f,t) => txAll().filter(x => x.date >= f && x.date <= t);
function findTxn(id){ return txAll().find(t => t.id === id); }
function sums(list){ let inc=0, exp=0, inv=0; for (const t of list) { if (t.type==='income') inc+=t.amount; else if (t.type==='expense') exp+=t.amount; else if (t.type==='transfer' && String(t.to).startsWith('inv:')) inv+=t.amount; } return {inc, exp, inv, net:inc-exp}; }
function byCat(list, type){ const m = {}; for (const t of list) if (t.type===type) m[t.cat] = (m[t.cat]||0) + t.amount; return Object.entries(m).sort((a,b) => b[1]-a[1]); }
const acctName = id => { if (String(id).startsWith('inv:')) { const i = S.investments.find(x => 'inv:'+x.id === id); return i ? i.name : 'Investment'; } const a = S.accounts.find(x => x.id === id); return a ? a.name : 'Deleted account'; };
function acctBalance(id, upto){
  const a = S.accounts.find(x => x.id === id); let b = a ? num(a.opening) : 0;
  for (const t of txAll()) { if (upto && t.date > upto) continue;
    if (t.type==='income' && t.acct===id) b += t.amount;
    else if (t.type==='expense' && t.acct===id) b -= t.amount;
    else if (t.type==='transfer') { if (t.acct===id) b -= t.amount; if (t.to===id) b += t.amount; } }
  return b;
}
const cashTotal = upto => sum(S.accounts, a => acctBalance(a.id, upto));
const invTotal = () => sum(S.investments, i => num(i.value));
const debtTotal = () => sum(S.debts, d => Math.max(0, num(d.balance)));
function invValueAt(inv, iso){
  if (iso >= todayISO()) return num(inv.value);
  const hist = (inv.history||[]).filter(h => h.date <= iso).sort((a,b) => a.date < b.date ? -1 : 1);
  if (!hist.length) return 0;
  const last = hist[hist.length-1];
  const contrib = sum(txAll().filter(t => t.type==='transfer' && t.to==='inv:'+inv.id && t.date > last.date && t.date <= iso), t => t.amount);
  return num(last.value) + contrib;
}
function debtAt(d, iso){
  if (d.start && d.start > iso) return 0;
  return Math.max(0, num(d.balance) + sum((d.payments||[]).filter(p => p.date > iso), p => num(p.amount)));
}
const netWorthAt = iso => cashTotal(iso) + sum(S.investments, i => invValueAt(i, iso)) - sum(S.debts, d => debtAt(d, iso));
/* ---------- tithe: a set share of all income, with unpaid balance carried forward ---------- */
const titheCfg = () => { const t = (S.settings && S.settings.tithe) || {}; return {on: t.on !== false, pct: num(t.pct) > 0 ? num(t.pct) : 10}; };
function titheIn(f, t){ const list = txIn(f, t), p = titheCfg().pct / 100; const inc = sum(list.filter(x => x.type === 'income'), x => x.amount); const paid = sum(list.filter(x => x.type === 'expense' && x.cat === 'church'), x => x.amount); return {inc, due: inc * p, paid}; }
function titheMonth(ym){
  const m = titheIn(...monthRange(ym));
  const all = txAll(); const first = all.length ? all[all.length - 1].date : null;
  const carry = first && first < ym + '-01' ? (() => { const r = titheIn(first, addMonths(ym, 0) + '-00'); return r.due - r.paid; })() : 0;
  return Object.assign(m, {carry, owed: carry + m.due - m.paid});
}
function titheCard(ym){
  if (!titheCfg().on) return '';
  const T = titheMonth(ym), pctv = titheCfg().pct, base = Math.max(0, T.due + T.carry);
  const left = T.owed;
  const carryLine = Math.abs(T.carry) >= 1 ? (T.carry > 0 ? `Includes ${ksh(T.carry)} still unpaid from earlier months.` : `Includes a ${ksh(-T.carry)} credit from paying extra in earlier months.`) : '';
  return `<section class="card">
    <div class="card-h"><h2>Tithe</h2><span class="sub">${pctv}% of all income</span></div>
    <div class="kv"><div><span>Due for ${MONTHS[+ym.slice(5)-1]}</span><b>${ksh(T.due)}</b></div><div><span>Paid in ${MONTHS[+ym.slice(5)-1]}</span><b>${ksh(T.paid)}</b></div><div><span>${left < -0.5 ? 'Paid ahead' : 'Still to pay'}</span><b>${ksh(Math.abs(left))}</b></div></div>
    <div class="prog" style="margin-top:12px"><i style="width:${base > 0 ? Math.min(100, (T.paid / base) * 100).toFixed(1) : (T.paid > 0 ? 100 : 0)}%"></i></div>
    <div class="brow-f" style="margin-top:6px"><span>${pctv}% of ${ksh(T.inc)} income in ${monthLabel(ym)}</span><span>${left <= 0.5 && (T.due > 0 || T.paid > 0) ? 'Fully paid' : base > 0 ? pct(T.paid, base) + '% paid' : ''}</span></div>
    ${carryLine ? `<p class="small muted" style="margin:8px 0 0">${carryLine}</p>` : ''}
    ${left > 0.5 ? `<div class="btns" style="margin-top:12px"><button class="btn sm ghost" data-act="pay-tithe" data-v="${Math.ceil(left)}" data-ym="${ym}">Record tithe payment</button></div>` : ''}
  </section>`;
}
function payoffMonths(d){
  const B = Math.max(0, num(d.balance)), P = num(d.monthly), r = num(d.rate)/1200;
  if (B <= 0) return 0; if (P <= 0) return null;
  if (r === 0) return Math.ceil(B/P);
  if (P <= B*r) return Infinity;
  return Math.ceil(-Math.log(1 - r*B/P) / Math.log(1+r));
}
function nextDue(dueDay){
  const t = new Date(); const d = +dueDay;
  let y = t.getFullYear(), m = t.getMonth();
  const cap = (yy,mm) => Math.min(d, new Date(yy, mm+1, 0).getDate());
  if (t.getDate() > cap(y,m)) { m++; if (m > 11) { m = 0; y++; } }
  const due = new Date(y, m, cap(y,m));
  const days = Math.round((due - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5);
  return {iso: isoOf(due), days};
}

/* ================= sample data ================= */
function makeSample(){
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const vary = (base, spread) => Math.round((base * (1 + (rnd()-.5)*spread)) / 10) * 10;
  const p = freshProfile();
  p.accounts = [{id:'mpesa',name:'M-Pesa',kind:'mobile',opening:9000},{id:'bank',name:'Equity Bank',kind:'bank',opening:60000},{id:'cash',name:'Cash',kind:'cash',opening:2000}];
  p.budgets = {rent:22000, food:15000, transport:7000, airtime:1500, power:2500, eatout:3000, fun:2500, family:8000, clothing:2000, church:9200};
  const today = todayISO(), cur = ymOf(today);
  const m6 = addMonths(cur,-6);
  p.investments = [
    {id:'s-mmf', name:'CIC Money Market Fund', type:'mmf', institution:'CIC Asset Management', principal:120000, value:131400, rate:12.5, start:m6+'-03', maturity:'', notes:'', history:[{date:m6+'-03', value:90000}]},
    {id:'s-tb', name:'364-day T-bill', type:'tbill', institution:'CBK DhowCSD', principal:100000, value:100000, rate:9.5, start:addMonths(cur,-8)+'-15', maturity:addMonths(cur,4)+'-15', notes:'Interest paid upfront as discount', history:[{date:addMonths(cur,-8)+'-15', value:100000}]},
    {id:'s-sacco', name:'Stima Sacco deposits', type:'sacco', institution:'Stima Sacco', principal:180000, value:180000, rate:11, start:'2023-01-10', maturity:'', notes:'Also backs the Sacco loan', history:[{date:'2023-01-10', value:180000}]},
    {id:'s-nse', name:'Safaricom & KCB shares', type:'nse', institution:'Faida Investment Bank', principal:45000, value:52300, rate:0, start:'2025-06-02', maturity:'', notes:'', history:[{date:'2025-06-02', value:45000},{date:addMonths(cur,-3)+'-28', value:49800}]},
    {id:'s-land', name:'1/8 acre plot, Kitengela', type:'land', institution:'', principal:650000, value:800000, rate:0, start:'2024-03-15', maturity:'', notes:'Title deed processed', history:[{date:'2024-03-15', value:650000},{date:addMonths(cur,-9)+'-01', value:800000}]},

/* ================= charts ================= */
function niceMax(v){ if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v/e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function tickCount(max){ const m = max / Math.pow(10, Math.floor(Math.log10(max))); return (m === 2.5 || m === 5) ? 5 : 4; }
function barChart(rows, o = {}){
  const W = 360, H = o.h || 190, L = 38, R = 6, T = 10, B = 22, iw = W-L-R, ih = H-T-B;
  const two = rows.some(r => r.b !== undefined);
  const max = niceMax(Math.max(1, ...rows.flatMap(r => two ? [r.a, r.b] : [r.a])));
  let g = '';
  const nt = tickCount(max);
  for (let i = 0; i <= nt; i++) { const y = T + ih - ih*i/nt; g += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="grid"/><text x="${L-6}" y="${y+3.5}" class="axis" text-anchor="end">${compact(max*i/nt)}</text>`; }
  const n = rows.length, gw = iw/n;
  const bw = two ? Math.max(3, Math.min(14, (gw-8)/2)) : Math.max(2, Math.min(18, gw-4));
  const every = n > 16 ? Math.ceil(n/8) : 1;
  rows.forEach((r,i) => {
    const cx = L + gw*i + gw/2;
    if (two) {
      const ha = ih*r.a/max, hb = ih*r.b/max;
      g += `<rect x="${cx-bw-1}" y="${T+ih-ha}" width="${bw}" height="${ha}" rx="2.5" class="bar-a"><title>${esc(r.label)}: income ${ksh(r.a)}</title></rect>`;
      g += `<rect x="${cx+1}" y="${T+ih-hb}" width="${bw}" height="${hb}" rx="2.5" class="bar-b"><title>${esc(r.label)}: spent ${ksh(r.b)}</title></rect>`;
    } else {
      const ha = ih*r.a/max;
      g += `<rect x="${cx-bw/2}" y="${T+ih-ha}" width="${bw}" height="${ha}" rx="2" class="bar-1"><title>${esc(r.full||r.label)}: ${ksh(r.a)}</title></rect>`;
    }
    if (i % every === 0) g += `<text x="${cx}" y="${H-6}" class="axis${r.on?' on':''}" text-anchor="middle">${esc(r.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.aria||'Bar chart')}">${g}</svg>`;
}
function lineChart(pts, o = {}){
  const W = 360, H = o.h || 170, L = 42, R = 10, T = 12, B = 22, iw = W-L-R, ih = H-T-B;
  const vals = pts.map(p => p.v); let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= Math.abs(lo)*.1 + 1; hi += Math.abs(hi)*.1 + 1; }
  const span = niceMax((hi-lo)*1.1); const step = span/4; lo = Math.floor(lo/step)*step; hi = lo + span; if (hi < Math.max(...vals)) hi += step;
  const x = i => L + (pts.length === 1 ? iw/2 : iw*i/(pts.length-1)), y = v => T + ih - ih*(v-lo)/(hi-lo);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = lo + (hi-lo)*i/4, yy = y(v); g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L-6}" y="${yy+3.5}" class="axis" text-anchor="end">${compact(v)}</text>`; }
  const d = pts.map((p,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const gid = 'lg' + Math.random().toString(36).slice(2,7);
  g += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c3);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--c3);stop-opacity:0"/></linearGradient></defs>`;
  g += `<path d="${d}L${x(pts.length-1).toFixed(1)},${T+ih}L${x(0).toFixed(1)},${T+ih}Z" fill="url(#${gid})"/>`;
  g += `<path d="${d}" fill="none" style="stroke:var(--c2)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const every = pts.length > 8 ? 2 : 1;
  pts.forEach((p,i) => { if (i % every === 0 || i === pts.length-1) g += `<text x="${x(i)}" y="${H-6}" class="axis" text-anchor="middle">${esc(p.label)}</text>`; });
  const li = pts.length-1;
  g += `<circle cx="${x(li)}" cy="${y(pts[li].v)}" r="4.5" style="fill:var(--surface);stroke:var(--c2)" stroke-width="2.2"><title>${ksh(pts[li].v)}</title></circle>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.aria||'Line chart')}">${g}</svg>`;
}
function spark(vals){
  const W = 320, H = 56; let lo = Math.min(...vals), hi = Math.max(...vals); if (lo === hi) { lo -= 1; hi += 1; }
  const x = i => vals.length === 1 ? W/2 : 4 + (W-8)*i/(vals.length-1), y = v => 6 + (H-12)*(1-(v-lo)/(hi-lo));
  const d = vals.map((v,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const li = vals.length-1;
  return `<svg class="hero-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${x(li)},${H}L${x(0)},${H}Z" style="fill:var(--hero-ink)" fill-opacity=".08"/><path d="${d}" fill="none" style="stroke:var(--hero-ink)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
const PAL = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
function donut(parts, top, bottom){
  const r = 54, c = 2*Math.PI*r, total = sum(parts, p => p.v) || 1; let off = 0, segs = '';
  parts.forEach((p,i) => { const len = c*p.v/total; if (len <= 0) return; segs += `<circle r="${r}" cx="70" cy="70" fill="none" style="stroke:${p.color||PAL[i%6]}" stroke-width="18" stroke-dasharray="${Math.max(0.01,len-(parts.length>1?1.5:0)).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(p.label)}: ${ksh(p.v)}</title></circle>`; off += len; });
  return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="${esc(top)} ${esc(bottom)}"><circle r="${r}" cx="70" cy="70" fill="none" class="donut-track" stroke-width="18"/>${segs}<text x="70" y="65" text-anchor="middle" class="donut-k">${esc(top)}</text><text x="70" y="84" text-anchor="middle" class="donut-v">${esc(bottom)}</text></svg>`;
}
function topN(entries, n){ const top = entries.slice(0,n); const rest = sum(entries.slice(n), e => e[1]); if (rest > 0) top.push(['__other', rest]); return top; }
const catLabel = id => id === '__other' ? 'Everything else' : (CAT_NAME[id] || 'Other');

function txRow(t){
  let ic, cls = '', title, sub, amt;
  const meta = [t.note, null].filter(Boolean);
  if (t.type === 'transfer') {
    cls = 'tr'; ic = '⇄'; title = String(t.to).startsWith('inv:') ? 'Invested: ' + acctName(t.to) : 'Transfer';
    sub = `${acctName(t.acct)} → ${acctName(t.to)} · ${fmtDate(t.date).slice(0,-5)}${t.fee>0?' · +'+ksh(t.fee)+' cost':''}`; amt = `<span class="tx-amt tr">${ksh(t.amount)}</span>`;
  } else {
    cls = t.type === 'income' ? 'in' : ''; ic = esc(CAT_INI[t.cat] || '•'); title = esc(CAT_NAME[t.cat] || 'Other');
    sub = [t.note ? esc(t.note) : '', esc(acctName(t.acct)), fmtDate(t.date).slice(0,-5), t.fee > 0 ? '+' + ksh(t.fee) + ' cost' : ''].filter(Boolean).join(' · ');
    amt = `<span class="tx-amt ${cls}">${t.type==='income'?'+':'−'}${ksh(t.amount)}</span>`;
  }
  return `<button class="tx" data-act="edit-txn" data-id="${esc(t.id)}"><span class="tx-ic ${cls}">${ic}</span><span class="tx-main"><span class="tx-title">${title}</span><span class="tx-sub">${t.type==='transfer'?esc(sub):sub}</span></span>${amt}</button>`;
}

/* ---------- HOME ---------- */
function renderHome(){
  const today = todayISO(), cur = ymOf(today), ym = UI.month, [f,t] = monthRange(ym);
  const list = txIn(f,t), s = sums(list);
  const cash = cashTotal(), inv = invTotal(), debt = debtTotal(), nw = cash + inv - debt;
  const months = [...Array(6)].map((_,i) => addMonths(cur, i-5));
  const series = months.map(m => netWorthAt(m === cur ? today : monthRange(m)[1]));
  const delta = nw - series[0];
  // spend vs same point last month
  const prev = addMonths(ym,-1), dayCut = ym === cur ? +today.slice(8) : dim(ym);
  const prevSpent = sums(txIn(prev+'-01', prev+'-'+pad(Math.min(dayCut, dim(prev))))).exp;
  const spentTo = ym === cur ? sums(txIn(f, today)).exp : s.exp;
  const chg = prevSpent > 0 ? Math.round((spentTo - prevSpent)/prevSpent*100) : null;
  const rate = s.inc > 0 ? Math.round((s.inc - s.exp)/s.inc*100) : null;

  const flow = [...Array(6)].map((_,i) => addMonths(ym, i-5)).map(m => { const [a,b] = monthRange(m); const x = sums(txIn(a,b)); return {label:MONTHS[+m.slice(5)-1], a:x.inc, b:x.exp, on:m===ym}; });
  const cats = byCat(list, 'expense'); const parts = topN(cats, 5);

  const budgets = Object.entries(S.budgets).filter(([,v]) => num(v) > 0).map(([c,v]) => { const sp = sum(list.filter(x => x.type==='expense' && x.cat===c), x => x.amount); return {c, v:num(v), sp, p: sp/num(v)}; }).sort((a,b) => b.p - a.p).slice(0,4);

  const upcoming = S.debts.filter(d => num(d.balance) > 0 && num(d.monthly) > 0 && d.dueDay).map(d => ({d, n:nextDue(d.dueDay)})).filter(x => x.n.days <= 14).sort((a,b) => a.n.days - b.n.days);

  const recent = list.slice(0,6);
  return `
  <section class="hero">
    <div class="hero-row"><span class="eyebrow">Net worth</span><span class="small" style="color:var(--hero-muted)">as of ${fmtDate(today)}</span></div>
    <div class="hero-num"><small>KSh</small>${kshNum(nw)}</div>
    <div class="hero-delta">${delta >= 0 ? '▲' : '▼'} ${ksh(Math.abs(delta))} since ${monthLabel(months[0])}</div>
    ${spark(series)}
    <div class="hero-split">
      <div><span>Cash & mobile</span><b>${ksh(cash)}</b></div>
      <div><span>Investments</span><b>${ksh(inv)}</b></div>
      <div><span>Debts</span><b>${debt>0?'−':''}${ksh(debt)}</b></div>
    </div>
  </section>
  <div class="stats">
    <div class="stat"><span>Income</span><b>${ksh(s.inc)}</b><em>${list.filter(x=>x.type==='income').length} receipts</em></div>
    <div class="stat"><span>Spent</span><b>${ksh(s.exp)}</b><em>${chg===null?'No prior month':(chg>0?'▲ ':'▼ ')+Math.abs(chg)+'% vs '+MONTHS[+prev.slice(5)-1]}</em></div>
    <div class="stat"><span>Left over</span><b class="${s.net<0?'neg':''}">${ksh(s.net)}</b><em>${rate===null?'—':rate+'% savings rate'}</em></div>
  </div>
  <div class="grid2">
    <section class="card">
      <div class="card-h"><h2>Cash flow</h2><span class="sub">Last 6 months</span></div>
      ${barChart(flow, {aria:'Income and spending, last six months'})}
      <div class="legend"><span><i style="background:var(--c2)"></i>Income</span><span><i style="background:var(--c5)"></i>Spending</span></div>
    </section>
    <section class="card">
      <div class="card-h"><h2>Where it went</h2><button class="link" data-act="go" data-view="reports">Full report</button></div>
      ${cats.length ? `<div class="split">${donut(parts.map(([c,v]) => ({label:catLabel(c), v})), 'Spent', compact(s.exp))}<div class="keys">${parts.map(([c,v],i) => `<div class="key"><i style="background:${PAL[i%6]}"></i><span>${esc(catLabel(c))}</span><b>${pct(v,s.exp)}%</b></div>`).join('')}</div></div>` : `<div class="empty">No spending recorded in ${monthLabel(ym)}.</div>`}
    </section>
    ${titheCard(ym)}
    <section class="card">
      <div class="card-h"><h2>Budgets</h2><button class="link" data-act="go" data-view="budget">See all</button></div>
      ${budgets.length ? `<div>${budgets.map(budgetRow).join('')}</div>` : `<div class="empty">Set monthly limits for rent, food, transport and more.<br><button class="btn sm ghost" data-act="edit-budgets">Set budgets</button></div>`}
    </section>
    <section class="card">
      <div class="card-h"><h2>Accounts</h2><button class="link" data-act="go-wealth" data-tab="accounts">Manage</button></div>
      <div>${S.accounts.map(a => acctRow(a)).join('')}</div>
    </section>
    ${upcoming.length ? `<section class="card"><div class="card-h"><h2>Due soon</h2><span class="sub">Next 14 days</span></div><div>${upcoming.map(({d,n}) => `<div class="acct"><span class="tx-ic">${n.days===0?'!':n.days}</span><span class="tx-main"><span class="tx-title">${esc(d.name)}</span><span class="tx-sub">${n.days===0?'Due today':n.days===1?'Due tomorrow':'Due '+fmtDay(n.iso)}</span></span><button class="btn sm ghost" data-act="pay-debt" data-id="${esc(d.id)}">Pay ${compact(Math.min(num(d.monthly), num(d.balance)))}</button></div>`).join('')}</div></section>` : ''}
    <section class="card">
      <div class="card-h"><h2>Recent</h2><button class="link" data-act="go" data-view="activity">All activity</button></div>
      ${recent.length ? `<div class="list">${recent.map(txRow).join('')}</div>` : `<div class="empty">Nothing recorded in ${monthLabel(ym)} yet.<br><button class="btn sm" data-act="add-txn">Add a transaction</button></div>`}
    </section>
  </div>`;
}
function budgetRow(b){
  const over = b.sp > b.v; const left = b.v - b.sp;
  return `<div class="brow"><div class="brow-h"><span>${esc(CAT_NAME[b.c]||b.c)}</span><span>${ksh(b.sp)} <span class="muted">/ ${compact(b.v)}</span></span></div><div class="prog ${over?'over':''}"><i style="width:${Math.min(100, b.p*100).toFixed(1)}%"></i>${b.pace!=null?`<span class="pace" style="left:${(b.pace*100).toFixed(1)}%"></span>`:''}</div><div class="brow-f"><span>${Math.round(b.p*100)}% used</span><span class="${over?'neg':''}">${over ? ksh(-left).replace('−','')+' over' : ksh(left)+' left'}</span></div></div>`;
}
function acctRow(a){
  const b = acctBalance(a.id);

}

function periodRange(){
  const today = todayISO(), cur = ymOf(today);
  switch (UI.period) {
    case 'month': return [cur+'-01', monthRange(cur)[1], monthLabel(cur, true)];
    case 'last': { const p = addMonths(cur,-1); return [p+'-01', monthRange(p)[1], monthLabel(p, true)]; }
    case 'quarter': { const a = addMonths(cur,-2); return [a+'-01', monthRange(cur)[1], `${monthLabel(a)} – ${monthLabel(cur)}`]; }
    case 'year': return [cur.slice(0,4)+'-01-01', monthRange(cur)[1], `${cur.slice(0,4)} so far`];
    case '12m': { const a = addMonths(cur,-11); return [a+'-01', monthRange(cur)[1], `${monthLabel(a)} – ${monthLabel(cur)}`]; }
    case 'custom': { const f = UI.from || addMonths(cur,-1)+'-01', t = UI.to || today; return f <= t ? [f, t, `${fmtDate(f)} – ${fmtDate(t)}`] : [t, f, `${fmtDate(t)} – ${fmtDate(f)}`]; }
  }
}
function reportData(){
  const [f,t,label] = periodRange(); const list = txIn(f,t); const s = sums(list);
  const end = t > todayISO() ? todayISO() : t;
  const days = Math.max(1, Math.round((Date.parse(end) - Date.parse(f))/864e5) + 1);
  const exp = byCat(list,'expense'), inc = byCat(list,'income');
  const byAcct = {}; list.filter(x => x.type==='expense').forEach(x => byAcct[x.acct] = (byAcct[x.acct]||0) + x.amount);
  const top = list.filter(x => x.type==='expense').sort((a,b) => b.amount - a.amount).slice(0,5);
  const months = []; for (let m = ymOf(f); m <= ymOf(t); m = addMonths(m,1)) months.push(m);
  return {f, t, label, list, s, days, exp, inc, byAcct: Object.entries(byAcct).sort((a,b) => b[1]-a[1]), top, months};
}

function syncTxnForm(form){
  const E = form.elements, type = E.type.value, catSel = E.cat;
  const ct = type === 'income' ? 'income' : 'expense';
  if (catSel.dataset.type !== ct) { catSel.innerHTML = catOpts(ct); catSel.dataset.type = ct; }
  form.querySelector('[data-when="cat"]').hidden = type === 'transfer';
  form.querySelector('[data-when="to"]').hidden = type !== 'transfer';
  form.querySelector('[data-when="loan"]').hidden = !(type === 'expense' && catSel.value === 'loan' && S.debts.length);
  form.querySelector('[data-lbl]').textContent = type === 'income' ? 'Received into' : type === 'transfer' ? 'From' : 'Paid from';
  form.querySelector('[data-when="fee"]').hidden = type === 'income';
  updateFeeHint(form); updateTitheHint(form);
}
function updateTitheHint(form){
  const h = form.querySelector('#titheHint'); if (!h) return; const a = num(form.elements.amount.value), on = titheCfg().on && form.elements.type.value === 'income';
  h.hidden = !on || !(a > 0); if (!h.hidden) h.textContent = `Tithe on this income (${titheCfg().pct}%): ${ksh(a * titheCfg().pct / 100)}`;
}
function updateFeeHint(form){
  const h = form.querySelector('#feeHint'); if (!h) return; const E = form.elements, a = num(E.amount.value), f = num(E.fee.value);
  h.textContent = f > 0 ? `Recorded as M-Pesa & bank charges from the same account. Total out: ${ksh(a + f)}.` : 'Paybill charges vary by business. Check the cost in your M-Pesa message.';
}
function linkTxn(t, sign){
  let changed = false;
  if (t.type === 'expense' && t.debtId) { const d = S.debts.find(x => x.id === t.debtId); if (d) { d.balance = Math.round((num(d.balance) - sign*t.amount)*100)/100; d.payments = (d.payments||[]).filter(p => p.id !== t.id); if (sign > 0) d.payments.push({id:t.id, date:t.date, amount:t.amount}); changed = true; } }
  if (t.type === 'transfer' && String(t.to).startsWith('inv:')) { const i = S.investments.find(x => 'inv:'+x.id === t.to); if (i) { i.principal = num(i.principal) + sign*t.amount; i.value = num(i.value) + sign*t.amount; changed = true; } }
  return changed;
}
function removeTxn(t){ const m = ymOf(t.date); M[m] = (M[m]||[]).filter(x => x.id !== t.id && x.feeOf !== t.id); if (!M[m].length) M[m] = []; TX = null; }
function saveTxn(form){
  const E = form.elements, type = E.type.value, amount = Math.round(num(E.amount.value)*100)/100, date = E.date.value;
  if (!(amount > 0)) return formErr(form, 'Enter an amount greater than zero.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return formErr(form, 'Choose a date.');
  const fee = type === 'income' ? 0 : Math.round(num(E.fee.value)*100)/100;
  if (fee < 0) return formErr(form, 'Transaction cost cannot be negative.');
  const t = {id: form.dataset.id || uid(), ts: Date.now(), type, amount, date, acct: E.acct.value, note: E.note.value.trim().slice(0,80)};
  if (fee > 0) t.fee = fee;
  if (type === 'transfer') { t.to = E.to.value; if (t.to === t.acct) return formErr(form, 'Pick two different accounts to move money between.'); }
  else { t.cat = E.cat.value; if (type === 'expense' && t.cat === 'loan' && E.debtId.value) t.debtId = E.debtId.value; }
  const old = form.dataset.id ? findTxn(form.dataset.id) : null;
  let profile = false; const months = new Set([ymOf(date)]);
  if (old) { if (linkTxn(old, -1)) profile = true; removeTxn(old); months.add(ymOf(old.date)); t.ts = old.ts || t.ts; }
  if (linkTxn(t, 1)) profile = true;
  (M[ymOf(date)] ||= []).push(t);
  if (t.fee > 0) M[ymOf(date)].push(feeChild(t));
  closeSheet(); commit({profile, months:[...months]}); toast(old ? 'Transaction updated' : 'Transaction saved');
}

function saveFile(filename, data){
  try {
    const type = filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : filename.endsWith('.html') ? 'text/html;charset=utf-8' : filename.endsWith('.pdf') ? 'application/pdf' : 'application/json';
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Saved to your Downloads');
  } catch(e) { toast('Could not save the file. Try again.'); }
}

  doc.setTextColor(...C.pale); doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.text('HAZINA MONEY', ML + 13, 14, {charSpace:.6});
  doc.setTextColor(...C.white); doc.setFontSize(21); doc.text('Money report', ML, 27);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...C.pale);
  doc.text(pt(`${R.label}   |   ${fmtDate(R.f)} to ${fmtDate(R.t)}`), ML, 34);
  doc.setFontSize(8.5); doc.text(pt('Generated ' + fmtDate(todayISO())), W - ML, 14, {align:'right'});

  kpis.forEach(([label, val, bad], i) => {

  else { const ym = R.months[0]; rows = []; for (let d = 1; d <= dim(ym); d++) { const iso = ym + '-' + pad(d); rows.push({label:String(d), a: iso >= R.f && iso <= R.t ? sum(R.list.filter(x => x.type === 'expense' && x.date === iso), x => x.amount) : 0}); } }

    doc.text('Hazina Money', ML, H - 8); doc.text(`Page ${i} of ${pages}`, W - ML, H - 8, {align:'right'});

  return {doc, R};
}
async function exportPDF(){
  toast('Preparing your PDF…');
  try { await loadPdfLib(); } catch(e) { toast('Couldn\'t load the PDF tool. Open Hazina once with internet so it can be saved for offline use, then try again.'); return; }
  try { const {doc, R} = buildPDF(); saveFile(`hazina-report-${R.f}-to-${R.t}.pdf`, doc.output('blob')); }
  catch(e) { toast('Couldn\'t create the PDF. Try a shorter period.'); }
}

function exportJSON(){ saveFile(`hazina-backup-${todayISO()}.json`, JSON.stringify({app:'hazina-money', version:1, exported:new Date().toISOString(), S, M}, null, 1)); }
function confirmImport(d){
  if (!d || !d.S || typeof d.M !== 'object') { toast('That file is not a Hazina backup.'); return; }
  const n = Object.values(d.M).reduce((t, a) => t + (Array.isArray(a) ? a.length : 0), 0);
  window.__pendingImport = d;
  openSheet('Restore backup', `<p style="margin:0 0 14px">Replace everything on this phone with the backup from ${esc(d.exported ? fmtDate(String(d.exported).slice(0,10)) : 'an earlier date')}? It has ${n} transactions, ${(d.S.investments||[]).length} investments and ${(d.S.debts||[]).length} loans.</p><div class="f-actions"><button class="btn line" data-act="close-sheet">Cancel</button><button class="btn" data-act="import-go">Replace my data</button></div>`);
}
function importJSON(file){
  const r = new FileReader();
  r.onload = () => { let d; try { d = JSON.parse(r.result); } catch(e) { toast('That file is not a valid backup.'); return; } confirmImport(d); };
  r.readAsText(file);
}

/* ================= events ================= */
let toastT = null;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case 'go': UI.view = b.dataset.view; render(); window.scrollTo(0,0); break;
    case 'go-wealth': UI.view = 'wealth'; UI.wealthTab = b.dataset.tab; render(); window.scrollTo(0,0); break;
    case 'month': { const d = +b.dataset.d; const cur = ymOf(todayISO()); UI.month = d === 0 ? cur : addMonths(UI.month, d); if (UI.month > cur) UI.month = cur; render(); break; }
    case 'add-txn': openTxn(null, {type:b.dataset.type, to:b.dataset.to}); break;
    case 'edit-txn': { const t = findTxn(id); openTxn(t && t.feeOf && findTxn(t.feeOf) ? t.feeOf : id); break; }
    case 'fee-est': { const form = b.closest('form'), a = num(form.elements.amount.value); if (!(a > 0)) { formErr(form, 'Enter the amount first to estimate the cost.'); break; }
      let fee = 0; if (b.dataset.k !== 'till') { fee = mpesaFee(b.dataset.k === 'wd' ? MPESA_WD : MPESA_SEND, a); if (fee === null) { formErr(form, b.dataset.k === 'wd' && a < 50 ? 'The smallest agent withdrawal is KSh 50.' : 'That is above the M-Pesa limit of KSh 250,000.'); break; } }
      form.elements.fee.value = fee > 0 ? fee : ''; formErr(form, ''); updateFeeHint(form); break; }
    case 'close-sheet': closeSheet(); break;
    case 'txtype': UI.txType = b.dataset.k; render(); break;
    case 'wtab': UI.wealthTab = b.dataset.k; render(); break;
    case 'period': UI.period = b.dataset.k; render(); break;
    case 'dstrat': S.settings.debtStrategy = b.dataset.k; if (MODE === 'sample') render(); else commit({profile:true}); break;
    case 'edit-budgets': openBudgets(); break;
    case 'budget-fill': $('#sheet').querySelectorAll('[data-last]').forEach(inp => { const v = +inp.dataset.last; if (v > 0 && !inp.value) inp.value = Math.ceil(v/500)*500; }); break;
    case 'edit-goal': openGoal(id); break;
    case 'goal-add': openGoalAdd(id); break;
    case 'edit-inv': openInv(id); break;
    case 'inv-value': openInvValue(id); break;
    case 'edit-debt': openDebt(id); break;
    case 'pay-tithe': openTxn(null, {type:'expense', cat:'church', amount:b.dataset.v, note:'Tithe for ' + monthLabel(b.dataset.ym, true)}); break;
    case 'pay-debt': { if (guardSample()) break; const d = S.debts.find(x => x.id === id); if (d) openTxn(null, {type:'expense', cat:'loan', debtId:d.id, amount:Math.min(num(d.monthly)||num(d.balance), num(d.balance)), note:d.name, acct:(S.accounts.find(a=>a.kind==='bank')||S.accounts[0]).id}); break; }
    case 'edit-acct': openAcct(id); break;
    case 'start-fresh': guardSample(); break;
    case 'start-fresh-go': closeSheet(); startFresh(); break;
    case 'record-net': openTxn(null, {type:'income', cat:'salary', amount:b.dataset.v, note:'Net salary'}); break;
    case 'export-csv': exportCSV(); break;
    case 'export-report': exportReport(); break;
    case 'export-pdf': exportPDF(); break;
    case 'export-summary': exportSummaryCSV(); break;
    case 'export-json': if (MODE === 'sample') { toast('Start your tracker first, then back up your own data.'); break; } exportJSON(); break;
    case 'import-go': { const d = window.__pendingImport; if (!d) break; const oldKeys = Object.keys(M); S = normalize(d.S); M = {}; for (const k in d.M) if (/^\d{4}-\d{2}$/.test(k) && Array.isArray(d.M[k])) M[k] = d.M[k].filter(t => t && t.id && t.date && t.amount > 0); MODE = 'real'; applyTheme(); closeSheet(); commit({profile:true, months:[...new Set([...oldKeys, ...Object.keys(M)])]}); toast('Backup restored'); window.__pendingImport = null; break; }
    case 'pin-key': pinKey(b.dataset.k); break;
    case 'unlock-bio': tryBio(); break;
    case 'lock-cancel': if (lockCtx && lockCtx.cancel) hideLock(); break;
    case 'lock-now': lockNow(false); break;
    case 'lock-setup': choosePin(async pin => { await setPin(pin); LOCK.enabled = true; LOCK.credId = ''; await saveLock(); render(); if (BIO_OK) offerBio(); else toast('App lock is on'); }); break;
    case 'bio-on': (async () => { try { LOCK.credId = await bioRegister(); await saveLock(); closeSheet(); render(); toast('Fingerprint unlock is on'); } catch(e) { toast(e && e.name === 'NotAllowedError' ? 'Fingerprint setup was cancelled.' : 'Couldn\'t set up fingerprint unlock on this phone.'); } })(); break;
    case 'bio-off': requireAuth(async () => { LOCK.credId = ''; await saveLock(); render(); toast('Fingerprint unlock is off. Your PIN still locks Hazina.'); }); break;
    case 'pin-change': requireAuth(() => choosePin(async pin => { await setPin(pin); await saveLock(); toast('PIN changed'); })); break;
    case 'lock-off': requireAuth(async () => { LOCK = Object.assign({}, LOCK_DEFAULT); await saveLock(); render(); toast('App lock is off'); }); break;
    case 'backup-setup': openBackupSetup(); break;
    case 'backup-now': runBackup('manual'); break;
    case 'backup-restore': openDriveRestore(); break;
    case 'restore-pick': restorePick(id); break;
    case 'copy-script': copyText(SCRIPT_TEMPLATE.replace('PASTE-YOUR-KEY-HERE', META.key), 'Script'); break;
    case 'copy-key': copyText(META.key, 'Key'); break;
    case 'install-app': if (installEvt) { const ev = installEvt; ev.prompt(); ev.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case 'clear-all':
      openSheet('Clear all data', `<p style="margin:0 0 14px">This deletes every transaction, budget, goal, investment and debt on this phone. Your Google Drive backups are not touched.</p><div class="f-actions"><button class="btn line" data-act="close-sheet">Cancel</button><button class="btn danger" data-act="clear-go">Delete everything</button></div>`); break;
    case 'clear-go': { const keys = Object.keys(M); S = freshProfile(); M = {}; MODE = 'real'; applyTheme(); closeSheet(); commit({profile:true, months:keys}); toast('All data cleared'); break; }
    case 'del-txn': armDelete(b, () => { const t = findTxn($('#sheet form').dataset.id); if (!t) return; const p = linkTxn(t, -1); removeTxn(t); closeSheet(); commit({profile:p, months:[ymOf(t.date)]}); toast('Transaction deleted'); }); break;
    case 'del-goal': armDelete(b, () => { const gid = $('#sheet form').dataset.id; S.goals = S.goals.filter(g => g.id !== gid); closeSheet(); commit({profile:true}); toast('Goal deleted'); }); break;
    case 'del-inv': armDelete(b, () => { const iid = $('#sheet form').dataset.id; S.investments = S.investments.filter(g => g.id !== iid); closeSheet(); commit({profile:true}); toast('Investment deleted'); }); break;
    case 'del-debt': armDelete(b, () => { const did = $('#sheet form').dataset.id; S.debts = S.debts.filter(g => g.id !== did); closeSheet(); commit({profile:true}); toast('Loan deleted'); }); break;
    case 'del-acct': { const aid = $('#sheet form').dataset.id; if (txAll().some(t => t.acct === aid || t.to === aid)) { formErr($('#sheet form'), 'This account has transactions. Move or delete them first.'); break; } armDelete(b, () => { S.accounts = S.accounts.filter(a => a.id !== aid); closeSheet(); commit({profile:true}); toast('Account deleted'); }); break; }
  }
});
document.addEventListener('change', e => {
  const f = e.target.closest('form');
  if (f && f.dataset.form === 'txn' && (e.target.name === 'type' || e.target.name === 'cat')) syncTxnForm(f);
  if (f && f.dataset.form === 'settings') {
    if (MODE === 'sample' && e.target.name === 'name') { guardSample(); return; }
    if (e.target.name === 'theme') { S.settings.theme = e.target.value; applyTheme(); if (MODE === 'real') commit({profile:true}); }
    if (e.target.name === 'name') { S.settings.name = e.target.value.trim().slice(0,30); commit({profile:true}); }
    if (e.target.name === 'titheOn' || e.target.name === 'tithePct') { const v = num(f.elements.tithePct.value); S.settings.tithe = {on: f.elements.titheOn.checked, pct: v > 0 && v <= 100 ? v : 10}; if (MODE === 'real') commit({profile:true}); else render(); toast(S.settings.tithe.on ? `Tithe set to ${S.settings.tithe.pct}% of income` : 'Tithe tracking is off'); }
  }
  if (e.target.id === 'lockAfter') { LOCK.after = +e.target.value; saveLock(); }
  if (e.target.id === 'autoBackup') { META.auto = e.target.checked; saveMeta(); setStatus(); render(); if (META.auto) checkBackup(); }
  if (e.target.id === 'importFile' && e.target.files[0]) { importJSON(e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'rFrom' || e.target.id === 'rTo') { UI.from = $('#rFrom').value; UI.to = $('#rTo').value; render(); }
});
let qT = null;
document.addEventListener('input', e => {
  if (e.target.id === 'txSearch') { UI.q = e.target.value; clearTimeout(qT); qT = setTimeout(fillTxList, 150); }
  if (e.target.form && e.target.form.dataset.form === 'txn' && (e.target.name === 'amount' || e.target.name === 'fee')) { updateFeeHint(e.target.form); updateTitheHint(e.target.form); }
  if (e.target.id === 'payeGross') { UI.gross = e.target.value; updatePaye(); }
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.form) return; e.preventDefault();
  const E = f.elements, id = f.dataset.id;
  switch (f.dataset.form) {
    case 'txn': saveTxn(f); break;
    case 'budgets': { const b = {}; CATS.expense.forEach(([c]) => { const v = num(E['b_'+c].value); if (v > 0) b[c] = v; }); S.budgets = b; closeSheet(); commit({profile:true}); toast('Budget limits saved'); break; }
    case 'goal': { const name = E.name.value.trim(), target = num(E.target.value); if (!name) return formErr(f, 'Give the goal a name.'); if (!(target > 0)) return formErr(f, 'Enter a target amount.');
      const g = id ? S.goals.find(x => x.id === id) : {id:uid()}; Object.assign(g, {name, target, saved:Math.max(0,num(E.saved.value)), deadline:E.deadline.value}); if (!id) S.goals.push(g); closeSheet(); commit({profile:true}); toast('Goal saved'); break; }
    case 'goal-add': { const a = num(E.amount.value); if (!(a > 0)) return formErr(f, 'Enter an amount greater than zero.'); const g = S.goals.find(x => x.id === id); g.saved = num(g.saved) + a; closeSheet(); commit({profile:true}); toast(num(g.saved) >= num(g.target) ? 'Goal reached. Hongera!' : 'Savings added'); break; }
    case 'inv': { const name = E.name.value.trim(), principal = num(E.principal.value); if (!name) return formErr(f, 'Give the investment a name.'); if (!(principal >= 0) || E.principal.value.trim() === '') return formErr(f, 'Enter how much you put in.');
      const value = E.value.value.trim() === '' ? principal : num(E.value.value);
      const i = id ? S.investments.find(x => x.id === id) : {id:uid(), history:[]};
      const changed = !id || num(i.value) !== value;
      Object.assign(i, {name, type:E.type.value, institution:E.institution.value.trim(), principal, value, rate:num(E.rate.value), start:E.start.value, maturity:E.maturity.value, notes:E.notes.value.trim()});
      if (!id) { i.history.push({date:i.start || todayISO(), value:principal}); if (value !== principal) i.history.push({date:todayISO(), value}); S.investments.push(i); }
      else if (changed) { i.history = (i.history||[]).filter(h => h.date !== todayISO()); i.history.push({date:todayISO(), value}); }
      closeSheet(); commit({profile:true}); toast('Investment saved'); break; }
    case 'inv-value': { const v = num(E.value.value), d = E.date.value || todayISO(); if (!(v >= 0) || E.value.value.trim() === '') return formErr(f, 'Enter the current value.'); const i = S.investments.find(x => x.id === id); i.history = (i.history||[]).filter(h => h.date !== d); i.history.push({date:d, value:v}); i.history.sort((a,b) => a.date < b.date ? -1 : 1); if (d >= i.history[i.history.length-1].date) i.value = v; closeSheet(); commit({profile:true}); toast('Value updated'); break; }
    case 'debt': { const name = E.name.value.trim(), principal = num(E.principal.value); if (!name) return formErr(f, 'Give the loan a name.'); if (!(principal > 0)) return formErr(f, 'Enter the original amount borrowed.');
      const balance = E.balance.value.trim() === '' ? principal : num(E.balance.value); const due = Math.round(num(E.dueDay.value));
      if (E.dueDay.value.trim() && (due < 1 || due > 31)) return formErr(f, 'Due day must be between 1 and 31.');
      const d = id ? S.debts.find(x => x.id === id) : {id:uid(), payments:[]};
      Object.assign(d, {name, type:E.type.value, lender:E.lender.value.trim(), principal, balance, rate:num(E.rate.value), monthly:num(E.monthly.value), dueDay:due||'', start:E.start.value, notes:E.notes.value.trim()});
      if (!id) S.debts.push(d); closeSheet(); commit({profile:true}); toast('Loan saved'); break; }
    case 'acct': { const name = E.name.value.trim(); if (!name) return formErr(f, 'Give the account a name.');
      const a = id ? S.accounts.find(x => x.id === id) : {id:uid()}; Object.assign(a, {name, kind:E.kind.value, opening:num(E.opening.value)}); if (!id) S.accounts.push(a); closeSheet(); commit({profile:true}); toast('Account saved'); break; }
    case 'backup-connect': {
      const url = E.url.value.trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return formErr(f, 'Paste the Web app URL from Apps Script. It starts with https://script.google.com and ends with /exec.');
      if (!online()) return formErr(f, 'Connect to the internet to finish setup.');
      const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Checking…';
      const prev = META.url; META.url = url;
      callScript({action:'ping'}).then(async () => { META.lastError = ''; await saveMeta(); closeSheet(); toast('Connected to Google Drive'); render(); runBackup('manual'); })
        .catch(err => { META.url = prev; btn.disabled = false; btn.textContent = 'Connect and back up now'; formErr(f, err.message); });
      break; }
    case 'openings': { S.accounts.forEach(a => { const inp = E['o_'+a.id]; if (inp) a.opening = num(inp.value); }); if (E.name.value.trim()) S.settings.name = E.name.value.trim().slice(0,30); closeSheet(); UI.view = 'home'; commit({profile:true}); toast('You\'re set. Tap + to record your first transaction.'); break; }
  }
});
document.addEventListener('keydown', e => {
  if (lockCtx) {
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pinKey(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); pinKey('del'); }
    else if (e.key === 'Escape' && lockCtx.cancel) hideLock();
    return;
  }
  if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet();
});

/* ================= boot ================= */
(async function boot(){
  try { await IDB.open(); } catch(e) {}
  const lk = await kvGet('lock'); if (lk) LOCK = Object.assign({}, LOCK_DEFAULT, lk);
  if (LOCK.enabled) showLock({mode:'unlock', autoBio:true});
  BIO_OK = await bioAvailable();
  const saved = await kvGet('data'); await reloadMeta();
  if (saved && saved.S) { S = normalize(saved.S); M = saved.M || {}; MODE = 'real'; }
  else { const s = makeSample(); S = s.p; M = s.months; MODE = 'sample'; }
  if (location.hash && /^#(home|activity|budget|wealth|reports|more)$/.test(location.hash)) UI.view = location.hash.slice(1);
  applyTheme(); render(); setStatus();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname))) navigator.serviceWorker.register('./sw.js').then(registerBackground).catch(() => {});
  try { if (navigator.storage && navigator.storage.persisted) PERSISTED = await navigator.storage.persisted(); } catch(e) {}
  window.addEventListener('online', () => { setStatus(); checkBackup(); });
  window.addEventListener('offline', () => setStatus());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { writeData(); hiddenAt = Date.now(); if (LOCK.enabled && +LOCK.after === 0) { if (lockCtx && !isLocked()) hideLock(); lockNow(false); } }
    else {
      checkBackup(); scheduleMidnight();
      if (LOCK.enabled && !isLocked() && hiddenAt && Date.now() - hiddenAt >= LOCK.after * 1000) { if (lockCtx) hideLock(); lockNow(true); }
      else if (isLocked()) setTimeout(tryBio, 300);
    }
  });
  window.addEventListener('pagehide', () => { writeData(); });
  scheduleMidnight(); checkBackup();
})();
